<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q9 CSS Simple Login Form</title>
<style>body{margin:0;background:linear-gradient(135deg,#f7dc62,#fbc54a);font-family:"Open Sans",Arial,sans-serif;text-align:center;padding:20px}
h1{color:white;margin:10px 0 0}h4{color:#fbeaa0;margin:5px 0 60px}
.box{background:white;width:430px;margin:auto;padding:30px 20px;text-align:left;box-shadow:0 8px 6px #555}
.tag{background:#96c800;color:white;display:inline-block;padding:14px 20px;margin-left:-20px;margin-bottom:25px}
input{display:block;width:100%;box-sizing:border-box;padding:14px;border:1px solid #96c800;margin-bottom:20px;font-size:16px}
button{background:#96c800;color:white;border:0;padding:14px 30px;font-size:16px;float:right}.box:after{content:"";display:block;clear:both}</style></head>
<body><h1>CSS Simple Login Form</h1><h4>Easy to customize and re-useable Form</h4>
<div class="box"><div class="tag">Let's Login</div>
<form><input type="text" placeholder="Username"><input type="password" placeholder="Password">
<button type="submit">Log in</button></form></div></body></html>
