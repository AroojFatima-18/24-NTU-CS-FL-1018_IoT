<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q11 Contact Us</title>
<style>body{font-family:"Open Sans",Arial,sans-serif;font-size:13px;margin:20px 40px}
.top{display:flex;gap:30px;margin-bottom:30px}.pic{width:410px;height:410px;display:block;object-fit:cover;object-position:center top}
.form{width:270px}h1{font-weight:normal;font-size:34px;text-align:center;margin:10px 0}
label{display:block;margin-top:14px}input[type=text],input[type=email],textarea{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid #999;padding:8px 4px}
textarea{height:90px}button{width:100%;background:#e01f26;color:white;border:0;padding:14px;margin-top:12px;font-weight:bold;border-radius:3px}
.cards{display:flex;gap:12px}.card{flex:1;background:#e01f26;color:white;padding:20px 20px 25px}.card h3{margin:0 0 15px;font-size:15px}.card p{margin:0}</style></head>
<body><div class="top"><img class="pic" src="images/q11_woman.jpg" alt="Contact Us">
<div class="form"><h1>Contact Us</h1>
<form><label>Name</label><input type="text" placeholder="Enter your Name">
<label>Email</label><input type="email" placeholder="Enter a valid email address">
<label>Message</label><textarea></textarea>
<p><input type="checkbox"> I accept the <a href="#">Terms of Service</a></p>
<button type="submit">SUBMIT</button></form></div></div>
<div class="cards">
<div class="card"><h3>CALL US</h3><p>1 (234) 567-891,<br>1 (234) 987-654</p></div>
<div class="card"><h3>LOCATION</h3><p>121 Rock Sreet, 21 Avenue, New York, NY 92103-9000</p></div>
<div class="card"><h3>HOURS</h3><p>Mon &ndash; Fri ...... 11 am &ndash; 8 pm, Sat, Sun ...... 6 am &ndash; 8 pm</p></div></div>
</body></html>
