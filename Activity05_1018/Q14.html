<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q14 Sign in and Sign up</title>
<style>body{font-family:Arial,sans-serif;font-size:12px;display:flex;gap:30px;align-items:flex-start;padding:20px}
.out{background:#fcc230;padding:12px}.mid{background:#ddd;padding:10px}.in{background:white;border-radius:4px;padding:15px 20px;box-shadow:0 1px 3px #777;width:200px}
.logo{border:2px dashed #fcc230;color:#fcc230;font-weight:bold;text-align:center;padding:12px;width:80px;margin:0 auto 15px}
label{display:block;color:#888;margin-top:8px}b{color:red}input{width:100%;box-sizing:border-box;border:1px solid #fcc230;padding:7px;margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.row a{color:#fcc230;text-decoration:none}
button{background:#fcc230;color:white;border:0;padding:8px 22px}</style></head>
<body>
<div class="out"><div class="mid"><div class="in"><div class="logo">Your Logo Here</div>
<form><label>First name<b>*</b></label><input type="text"><label>Last name<b>*</b></label><input type="text">
<label>Email address<b>*</b></label><input type="email"><label>Password<b>*</b></label><input type="password">
<label>Again password<b>*</b></label><input type="password">
<div class="row"><a href="#">Have an account</a><button type="submit">Signup</button></div></form></div></div></div>
<div class="out" style="margin-top:80px"><div class="mid"><div class="in" style="width:230px"><div class="logo">Your Logo Here</div>
<form><label>Username or email address<b>*</b></label><input type="text"><label>Password<b>*</b></label><input type="password">
<div class="row"><span><a href="#">Forgot password?</a><br><a href="#">Create an account</a></span><button type="submit">Login</button></div></form></div></div></div>
</body></html>
