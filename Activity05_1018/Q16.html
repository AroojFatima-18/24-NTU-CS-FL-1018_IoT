<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q16 Book your table</title>
<style>body{font-family:"Open Sans",Arial,sans-serif;font-size:12px;margin:30px;display:flex;gap:30px;width:780px;margin:auto;padding-top:30px;align-items:center}
.pic{width:300px;height:auto;display:block}
.form{flex:1;background:#f1f1f1;border-radius:30px;padding:20px 25px}h1{font-weight:normal;font-size:24px;margin:0 0 15px}
.row{display:flex;gap:15px}.row div{flex:1}label{display:block;margin:12px 0 4px}
input,textarea{width:100%;box-sizing:border-box;border:0;border-radius:15px;padding:9px 10px}textarea{height:75px}
button{background:#74bde5;color:white;border:0;border-radius:20px;padding:10px 20px;font-weight:bold;margin-top:15px}</style></head>
<body><img class="pic" src="images/q16_food.jpg" alt="Book your table">
<div class="form"><h1>Book your table</h1>
<form><div class="row"><div><label>Phone</label><input type="text" placeholder="Enter your phone"></div>
<div><label>Name</label><input type="text" placeholder="Enter your Name"></div></div>
<label>Date</label><input type="text" placeholder="MM/DD/YYYY"><label>Message</label><textarea placeholder="Enter your message"></textarea>
<button type="submit">SUBMIT</button></form></div></body></html>
