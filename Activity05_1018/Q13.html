<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q13 Get in touch</title>
<style>body{margin:0;background:#0a4f82;font-family:Montserrat,Arial,sans-serif;padding:50px 0}
.card{background:#fafafa;width:340px;margin:auto;border-radius:25px;padding:30px 45px}
h1{color:#0a4f82;text-align:center;font-size:30px;margin:10px 0;border-bottom:1px solid #999;padding-bottom:12px}
label{display:block;font-weight:bold;font-size:11px;margin-top:20px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #333;padding:10px;margin-top:5px}
textarea{height:95px}.send{display:block;margin:25px auto 0;background:black;color:white;border:0;border-radius:25px;padding:14px 40px;font-weight:bold}</style></head>
<body><div class="card"><h1>Get in touch</h1>
<form><label>Name</label><input type="text"><label>Email address</label><input type="email">
<label>Message</label><textarea></textarea><button class="send" type="submit">Send</button></form></div></body></html>
