<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q18 Form</title>
<style>body{margin:0;font-family:"Open Sans",Arial,sans-serif;font-size:13px}
.wrap{display:flex;background:#d1c7c5;width:730px;margin:20px auto}.pic{flex:1;background:url(images/q18_laptop.jpg) left center/cover no-repeat}
.f{width:280px;padding:15px 25px 20px 0}.row{display:flex;gap:20px}.row div{flex:1}label{display:block;font-weight:bold;margin-top:20px}
input,textarea{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid #999;padding:10px;margin-top:3px}
textarea{height:85px}button{width:100%;background:#f7793b;color:white;border:0;border-radius:25px;padding:14px;font-weight:bold;margin-top:25px}
p{text-align:center;margin-top:35px}a{color:black}</style></head>
<body><div class="wrap"><div class="pic"></div>
<div class="f"><form><div class="row"><div><label style="margin-top:0">Email</label><input type="email" placeholder="Enter a valid email address"></div>
<div><label style="margin-top:0">Name</label><input type="text" placeholder="Enter your Name"></div></div>
<label>Address</label><input type="text" placeholder="Enter your address"><label>Message</label><textarea placeholder="Enter your message"></textarea>
<button type="submit">SUBMIT</button></form><p>Images from <a href="https://www.freepik.com">Freepik</a></p></div></div></body></html>
