<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q20 Signup Validation Design</title>
<style>body{margin:0;background:#4070f4;font-family:Poppins,Arial,sans-serif;display:flex;align-items:center;justify-content:space-around;min-height:100vh}
h1{color:white;font-size:44px;line-height:1.2;border-left:8px solid white;padding-left:25px;margin:0}
.card{background:white;width:300px;border-radius:6px;padding:25px}h2{font-size:16px;font-weight:500;margin:0 0 25px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d93025;border-radius:5px;font-size:12px}
.err{color:#d93025;font-size:10px;margin:6px 0 14px}button{width:100%;background:#4070f4;color:white;border:0;padding:12px;border-radius:5px;margin-top:5px}</style></head>
<body><h1>Form<br>Validation<br>JavaScript</h1>
<div class="card"><h2>Signup</h2>
<form><input type="text" value="codinglab@gmail">
<div class="err">&#9432; Please enter a valid email address</div>
<input type="text" value="codinglab123">
<div class="err">&#9432; Please enter atleast 8 character with number, symbol, capital and small letter</div>
<input type="text" value="codinglab12">
<div class="err">&#9432; Password don't match.</div>
<button type="submit">Signup Now</button></form></div></body></html>
