<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q4 Comments</title>
<style>body{background:#f4f4f4;font-family:Segoe UI,Arial,sans-serif;padding:30px}
.card{background:white;width:700px;margin:auto;padding:30px;box-shadow:0 8px 25px rgba(0,0,0,.45)}
.row{display:flex;gap:20px}.row div{flex:1}label{font-size:12px;display:block;margin:12px 0 6px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e5e5e5;border-radius:4px}
textarea{height:90px}button{background:#00896b;color:white;border:0;padding:14px 28px;margin-top:15px;border-radius:4px}
p{color:#555}</style></head>
<body><div class="card">
<h2>Comments</h2><h3 style="font-weight:normal">Leave a comment</h3>
<p>Your email address will not be published. Required fields are marked *</p>
<form><div class="row">
<div><label>Name *</label><input type="text" placeholder="Name" required></div>
<div><label>Email *</label><input type="email" placeholder="Email" required></div></div>
<label>Message *</label><textarea placeholder="Write your comment here..." required></textarea>
<button type="submit">&#10148; Post Comment</button>
</form></div></body></html>
