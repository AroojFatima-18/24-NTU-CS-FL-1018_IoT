<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q6 Project Management</title>
<style>body{font-family:Arial,sans-serif}h2{text-align:center;text-decoration:underline;font-size:20px}
form{background:#66f9f0;width:320px;margin:auto;padding:20px 15px}table{width:100%}td{padding:10px 4px;font-weight:bold;font-size:14px}
input[type=text],input[type=date],select{width:160px;padding:8px;border:1px solid #333;border-radius:4px}
textarea{width:160px;height:40px}.s{background:#22cc44;color:white;border:0;padding:10px 16px}
.c{background:#4f7cf2;color:white;border:0;padding:10px 20px}.b{text-align:center}</style></head>
<body><h2>Project Management</h2>
<form><table>
<tr><td>Project Name</td><td><input type="text" placeholder="project name"></td></tr>
<tr><td>Assigned to</td><td><select><option>Er Merry Petision</option><option>Ali Khan</option></select></td></tr>
<tr><td>Start Date</td><td><input type="date"></td></tr>
<tr><td>End Date</td><td><input type="date"></td></tr>
<tr><td>Priority</td><td><input type="radio" name="p"> High <input type="radio" name="p"> Average <input type="radio" name="p"> Low</td></tr>
<tr><td>Description</td><td><textarea></textarea></td></tr>
<tr><td colspan="2" class="b"><input type="submit" value="Submit" class="s"> &nbsp; &nbsp; <input type="reset" value="Clear" class="c"></td></tr>
</table></form></body></html>
