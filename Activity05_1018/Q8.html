<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q8 Register</title>
<style>body{font-family:Arial,sans-serif}.box{width:400px;margin:20px auto;border:5px solid #dde1ee;padding:20px 80px 20px 90px}
.box{width:500px;box-sizing:content-box;padding:10px 30px}h1{text-align:center}p{text-align:center}
.f{width:310px;margin:auto}label{font-weight:bold;display:block;margin-top:10px}
input{width:100%;box-sizing:border-box;padding:8px;border:0;background:#e1e0e3;margin:4px 0}
button{width:100%;padding:10px;background:#4510e8;color:white;border:0;margin-top:10px}</style></head>
<body><div class="box"><h1>Register</h1><p>Kindly fill in this form to register.</p>
<form class="f"><label>Username</label><input type="text" placeholder="Enter username">
<label>Email</label><input type="email" placeholder="Enter email">
<label>Password</label><input type="password" placeholder="Enter password">
<label>Repeat Password</label><input type="password" placeholder="Repeat password">
<button type="submit">Register</button></form>
<p>Already have an account? <a href="Q7.html">Log in</a>.</p></div></body></html>
