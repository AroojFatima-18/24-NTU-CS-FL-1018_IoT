<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q19 Login and Signup</title>
<style>body{margin:0;background:#4070f4;font-family:Poppins,Arial,sans-serif;font-size:11px;display:flex;gap:25px;justify-content:center;align-items:flex-start;padding:30px}
.card{background:white;width:240px;border-radius:6px;padding:15px 15px 20px;text-align:center}h2{font-size:18px;margin:10px 0 18px}
input{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:4px;padding:10px;margin-bottom:12px}
.main{width:100%;background:#0071d9;color:white;border:0;padding:10px;border-radius:4px}a{color:#0071d9;text-decoration:none}
.or{margin:12px 0;color:#888}.fb{background:#4267b2;color:white;padding:10px;border-radius:4px;margin-bottom:10px}.g{border:1px solid #ddd;padding:10px;border-radius:4px;color:#666}</style></head>
<body>
<div class="card"><h2>Login</h2><form><input type="email" placeholder="Email"><input type="password" placeholder="Password">
<a href="#">Forgot password?</a><br><br><button class="main" type="submit">Login</button></form>
<p>Don't have an account? <a href="#">Signup</a></p><div class="or">&mdash;&mdash; Or &mdash;&mdash;</div>
<div class="fb">Login with Facebook</div><div class="g">Login with Google</div></div>
<div class="card"><h2>Signup</h2><form><input type="email" placeholder="Email"><input type="password" placeholder="Create password"><input type="password" placeholder="Confirm password">
<button class="main" type="submit">Signup</button></form>
<p>Already have an account? <a href="#">Login</a></p><div class="or">&mdash;&mdash; Or &mdash;&mdash;</div>
<div class="fb">Login with Facebook</div><div class="g">Login with Google</div></div>
</body></html>
