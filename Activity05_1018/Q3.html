<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q3 New Product</title>
<style>body{background:#5878a0;font-family:Verdana,sans-serif;margin:0;padding:10px}
.box{background:white;border:2px solid #333;padding:30px 40px;height:420px}
h1{font-size:30px;margin:10px 0 15px}label{display:block;font-size:15px;margin-top:14px}
input[type=text]{width:170px}</style></head>
<body><div class="box">
<h1>New Product</h1>
<form>
<label>Name</label><input type="text" name="name">
<label>Price</label><input type="text" name="price">
<label>Released on</label>
<select name="year"><option>2010</option><option>2011</option><option>2012</option></select>
<select name="month"><option>October</option><option>November</option><option>December</option></select>
<select name="day"><option>4</option><option>5</option><option>6</option></select>
<label>Category</label><select name="cat"><option>Toys &amp; Games</option><option>Books</option><option>Electronics</option></select>
<label>Rating</label><select name="rating"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label>Discontinued</label><input type="checkbox" name="disc"><br><br>
<input type="submit" value="Create Product">
</form></div></body></html>
