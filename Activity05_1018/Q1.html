<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q1 Application Form</title>
<style>body{font-family:"Times New Roman",serif;margin:30px}h1{font-size:40px}p{margin:22px 0}</style></head>
<body>
<h1>Application Form</h1>
<form>
<p>First Name: <input type="text" name="fname" size="20"> Last Name: <input type="text" name="lname" size="20"></p>
<p>Date of birth: <input type="date" name="dob"> Age: <input type="number" name="age"></p>
<p>Gender: <select name="gender"><option>Male</option><option>Female</option></select>
Email Address: <input type="email" name="email" placeholder="Enter email address"></p>
<p>Positions Available:
<input type="radio" name="pos" value="junior"> Junior Developer
<input type="radio" name="pos" value="mid"> Mid-level Developer
<input type="radio" name="pos" value="senior"> Senior Developer</p>
<p>Programming Languages:
<input type="checkbox" name="lang" value="java"> Java
<input type="checkbox" name="lang" value="js"> JavaScript
<input type="checkbox" name="lang" value="py"> Python</p>
<p>Password: <input type="password" name="pass"> Confirm Password: <input type="password" name="cpass"></p>
<p><input type="submit" value="Submit"> <input type="reset" value="Reset"></p>
</form></body></html>
