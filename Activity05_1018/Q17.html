<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q17 ABC Company</title>
<style>body{margin:0;background:#fc3a4a;font-family:Arial,sans-serif;font-size:12px;padding:20px 100px}
.page{background:white;width:580px;margin:auto}.hero{display:block;width:calc(100% - 30px);height:240px;object-fit:cover;margin:0 15px}
.cities{display:flex;justify-content:space-around;font-weight:bold;font-size:14px;padding:25px 0}
.bottom{display:flex}.form{flex:1;padding:30px 20px}.map{flex:1;min-width:0;display:flex}.map img{flex:1;min-width:0;width:100%;object-fit:cover;object-position:left top;display:block}
h1{font-weight:normal;font-size:30px;text-align:center;margin:30px 0 50px}label{display:block;margin-top:15px}
input,textarea{width:100%;box-sizing:border-box;background:#e5e5e5;border:1px solid #ccc;border-radius:4px;padding:10px;margin-top:4px}
textarea{height:70px}button{width:100%;background:#fc3a4a;color:white;border:0;padding:12px;margin-top:20px;border-radius:4px;font-weight:bold}</style></head>
<body><div class="page"><img class="hero" src="images/q17_building.jpg" alt="Building">
<div class="cities"><span>Sydney</span><span>Melbourne</span><span>Los Angeles</span><span>London</span></div>
<div class="bottom"><div class="form"><h1>Get in Touch</h1>
<form><label>Name</label><input type="text" placeholder="Enter your Name"><label>Email</label><input type="email" placeholder="Enter a valid email address">
<label>How can we help?</label><textarea></textarea><button type="submit">SUBMIT</button></form></div>
<div class="map"><img src="images/q17_map.jpg" alt="Map - Manhattan, New York"></div></div></div></body></html>
