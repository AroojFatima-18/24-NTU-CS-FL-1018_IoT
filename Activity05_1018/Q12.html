<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q12 Login Flex</title>
<style>body{font-family:"Open Sans",Arial,sans-serif;margin:0;padding:30px}
.wrap{display:flex;gap:20px;width:740px;margin:auto}
.login{flex:1;background:linear-gradient(#7a80e8,#4352e0);border-radius:25px;color:white;padding:20px 25px;font-size:13px}
.img{flex:1;background:#fdb53a url(images/q12_man.jpg) center/cover no-repeat;border-radius:25px}
h2{text-align:center;margin:0 0 10px}input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:10px;border:0;border-radius:20px;margin:4px 0 10px}
button{width:100%;padding:12px;border:0;border-radius:20px;background:#f7cf2b;color:#3b3fb0;font-weight:bold;margin:10px 0 30px}
.links{display:flex;justify-content:space-between}.links a,.foot a{color:white}.foot{text-align:center;margin-top:30px}</style></head>
<body><div class="wrap"><div class="login"><h2>Log in</h2>
<form><label>Username *</label><input type="text" placeholder="Enter your Username">
<label>Password *</label><input type="password" placeholder="Enter your Password">
<input type="checkbox" checked> Remember me<button type="submit">LOGIN</button></form>
<div class="links"><a href="#">Forgot password?</a><a href="Q8.html">Don't have an account?</a></div>
<div class="foot">Image from <a href="https://www.freepik.com">Freepik</a></div></div>
<div class="img"></div></div></body></html>
