<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Q7 Login Form</title>
<style>body{margin:0;background:#aacfd6;font-family:Arial,sans-serif;font-size:12px}
h1{text-align:center;color:#f94327;font-size:28px;margin:0;padding:40px 0 20px;background:white}
.wrap{background:white;padding-bottom:60px}.box{width:300px;margin:auto;box-shadow:0 4px 12px #666}
.top{background:#d8d8d8;padding:20px}input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:12px 10px;border:0;border-radius:20px;margin:4px 0 8px}
button{width:100%;padding:12px;background:#f94327;color:white;border:0;border-radius:20px;font-weight:bold;margin-top:6px}
.bot{background:white;padding:25px 20px;display:flex;justify-content:space-between;border-bottom:6px solid #f94327}
.bot a{color:#f94327;font-weight:bold;text-decoration:none}</style></head>
<body><div class="wrap"><h1>Login Form</h1>
<div class="box"><form><div class="top">
<label>Username *</label><input type="text" placeholder="Enter your Username">
<label>Password *</label><input type="password" placeholder="Enter your Password">
<input type="checkbox"> Remember me<br><button type="submit">LOGIN</button></div></form>
<div class="bot"><a href="Q8.html">Don't have an account?</a><a href="#">Forgot password?</a></div></div></div></body></html>
